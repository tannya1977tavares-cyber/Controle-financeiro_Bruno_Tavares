name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Testar as regras
        run: npm test

      - name: Instalar dependências
        run: npm install

      - name: Copiar bibliotecas pro app
        run: |
          npm run libs
          echo "window.VERSAO_APP = ${{ github.run_number }};" > www/versao.js

      - name: Assinatura fixa (pra atualizar por cima sem desinstalar)
        env:
          ASSINATURA: ${{ secrets.ASSINATURA_APK }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ASSINATURA" ]; then echo "$ASSINATURA" | base64 -d > ~/.android/debug.keystore; echo "assinatura do segredo";
          elif [ -f assinatura/financeiro.keystore ]; then cp assinatura/financeiro.keystore ~/.android/debug.keystore; echo "assinatura do repositório";
          else echo "sem assinatura fixa"; fi

      - name: Criar projeto Android
        run: |
          npx cap add android
          VERSAO=${{ github.run_number }} python3 scripts/preparar-android.py
          npx cap sync android

      - name: Montar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinanceiroTavares.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceiroTavares-apk
          path: FinanceiroTavares.apk

      - name: Publicar pra baixar no celular
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Financeiro Tavares 1.0.${{ github.run_number }}
          body: Baixe o arquivo FinanceiroTavares.apk no celular e instale.
          files: FinanceiroTavares.apk
          make_latest: true
